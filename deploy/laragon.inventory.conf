# Copy to C:/laragon/etc/apache2/sites-enabled/inventory.conf.
# Add 127.0.0.1 inventory-tracking.system to the Windows hosts file, then reload Apache.
<VirtualHost *:80>
    ServerName inventory-tracking.system
    DocumentRoot "C:/laragon/www/inventory-tracking-system/public"
    DirectoryIndex index.php
    <Directory "C:/laragon/www/inventory-tracking-system/public">
        AllowOverride None
        Options -Indexes
        Require local
    </Directory>
</VirtualHost>
